      - "统一身份标识"
      - "单点登录办公门户/邮箱/VPN/NovaFlow 控制台等内部系统"
    annotated_by: "王荟茹"

  - id: C10
    category: 专业术语
    query: "POD 是什么流程?"
    expected_behavior: answer
    expected_doc_ids: [doc-prod-02]
    expected_chunk_ids: []
    expected_answer_points:
      - "Publish On Demand,按需发布流程"
      - "拆解为构建→灰度→全量三个阶段"
    annotated_by: "王荟茹"

  # ── 6. 知识库无答案(2 例)──
  - id: C11
    category: 知识库无答案
    query: "公司有宠物寄养福利吗?"
    expected_behavior: refuse
    expected_doc_ids: []
    expected_chunk_ids: []
    expected_answer_points: []
    annotated_by: "王荟茹"

  - id: C12
    category: 知识库无答案
    query: "出差住宿费标准是多少?"
    expected_behavior: refuse
    expected_doc_ids: []
    expected_chunk_ids: []
    expected_answer_points: []
    annotated_by: "王荟茹"

  # ── 7. 文档冲突(2 例)──
  - id: C13
    category: 文档冲突
    query: "市内交通费每天报销上限是多少?"
    expected_behavior: conflict
    expected_doc_ids: [doc-hr-03, doc-hr-04]
    expected_chunk_ids: []
    expected_answer_points:
      - "2024 版:每日上限 100 元"
      - "2026 版:每日上限 150 元"
      - "并列呈现双方来源,不替用户选边"
    annotated_by: "王荟茹"

  - id: C14
    category: 文档冲突
    query: "报销凭证需要保留多久?"
    expected_behavior: conflict
    expected_doc_ids: [doc-hr-03, doc-hr-04]
    expected_chunk_ids: []
    expected_answer_points:
      - "2024 版:保留 6 个月"
      - "2026 版:保留 2 年"
      - "并列呈现双方来源,不替用户选边"
    annotated_by: "王荟茹"
